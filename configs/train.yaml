# Training Configuration
training:
  seed: 42
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5

data:
  train_path: "data/processed/train"
  val_path: "data/processed/val"
  sample_path: "data/sample"

output:
  checkpoint_dir: "models/checkpoints"
  log_dir: "outputs/logs"
